name: Playwright BDD Tests

on:
  push:
    branches: ["playwright-automation"]
  workflow_dispatch:

jobs:
  playwright-run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Clone Practice Software Testing app
        run: git clone --depth 1 https://github.com/testsmith-io/practice-software-testing.git app-under-test

      - name: Start app via docker compose
        run: |
          cd app-under-test
          docker compose up -d
          echo "Waiting for laravel-api dependencies to install..."
          timeout 600 bash -c 'until docker compose exec -T laravel-api test -f vendor/autoload.php; do sleep 5; done'
          docker compose exec -T laravel-api chown -R www-data:www-data storage bootstrap/cache
          docker compose exec -T laravel-api php artisan migrate:refresh --seed

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm install
      - run: npx playwright install --with-deps

      - name: Wait for app to be ready
        run: npx wait-on http://localhost:4200 --timeout 600000

      - run: npm test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/