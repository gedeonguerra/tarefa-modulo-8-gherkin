name: Playwright BDD Tests

on:
  push:
    branches: ["playwright-automation"]
  workflow_dispatch:

jobs:
  playwright-run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Clone Practice Software Testing app
        run: git clone --depth 1 https://github.com/testsmith-io/practice-software-testing.git app-under-test

      - name: Start app via docker compose
        run: |
          cd app-under-test
          docker compose up -d
          echo "Waiting for laravel-api dependencies to install..."
          timeout 600 bash -c 'until docker compose exec -T laravel-api test -f vendor/autoload.php; do sleep 5; done'
          docker compose exec -T laravel-api php artisan migrate:refresh --seed

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm install
      - run: npx playwright install --with-deps

      - name: Wait for app to be ready
        run: npx wait-on http://localhost:4200 --timeout 600000

      - name: DEBUG TEMP - diagnostico API/proxy (remover apos identificar causa raiz)
        run: |
          cd app-under-test
          echo "--- docker compose logs laravel-api (tail 50) ---"
          docker compose logs laravel-api --tail 50
          echo "--- curl -s (body bruto) http://localhost:8091/api/products ---"
          curl -s http://localhost:8091/api/products | head -c 3000 || true
          echo
          echo "--- storage/ (ls -la) ---"
          docker compose exec -T laravel-api ls -la storage/ || true
          echo "--- storage/logs/ (ls -la) ---"
          docker compose exec -T laravel-api ls -la storage/logs/ 2>&1 || echo "storage/logs nao existe"
          echo "--- storage/framework/ (ls -la) ---"
          docker compose exec -T laravel-api ls -la storage/framework/ 2>&1 || true
          echo "--- storage/logs/laravel.log (tail 100) ---"
          docker compose exec -T laravel-api tail -n 100 storage/logs/laravel.log 2>&1 || echo "laravel.log nao existe"
          echo "--- php artisan about ---"
          docker compose exec -T laravel-api php artisan about

      - run: npm test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/