name: Playwright BDD Tests

on:
  push:
    branches: ["playwright-automation"]
  workflow_dispatch:

concurrency: production_environment

jobs:
  playwright-run:
    runs-on: ubuntu-22.04
    env:
      SPRINT: sprint5
      DISABLE_LOGGING: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Clone Practice Software Testing app
        run: |
          git clone --depth 1 https://github.com/testsmith-io/practice-software-testing.git app-under-test
          rm -rf app-under-test/.git

      - name: Start containers
        run: |
          cd app-under-test
          docker compose -f docker-compose.yml up -d --force-recreate

      - name: Sleep for 30 seconds (wait for containers)
        run: sleep 30s

      - name: Install Composer dependencies
        run: |
          cd app-under-test
          docker compose exec -T -u root laravel-api composer install --no-dev --optimize-autoloader --ignore-platform-req=ext-ffi

      - name: Wait for database to be ready
        run: |
          cd app-under-test
          echo "Waiting for MariaDB..."
          for i in $(seq 1 30); do
            if docker compose exec -T mariadb mysqladmin ping -h localhost -u root -proot --silent 2>/dev/null; then
              echo "MariaDB is ready!"
              break
            fi
            echo "Attempt $i/30 - not ready yet, waiting 2s..."
            sleep 2
          done

      - name: Create & Seed database
        run: |
          cd app-under-test
          docker compose exec -T laravel-api php artisan migrate:refresh --seed

      - name: Smoke test - API status
        run: curl -sf -X GET 'http://localhost:8091/status'

      - name: Smoke test - login
        run: |
          curl -sf -X POST 'http://localhost:8091/users/login' \
            -H 'Content-Type: application/json' \
            --data-raw '{"email":"customer@practicesoftwaretesting.com","password":"welcome01"}'

      - name: Wait for Angular UI to be ready
        run: |
          echo "Waiting for Angular UI on port 4200..."
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:4200 | grep -q "200"; then
              echo "Angular UI is ready!"
              exit 0
            fi
            echo "Attempt $i/60 - not ready yet, waiting 5s..."
            sleep 5
          done
          echo "Angular UI failed to start within 5 minutes"
          cd app-under-test && docker compose logs angular-ui
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci
      - run: npx playwright install --with-deps

      - run: npm test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/