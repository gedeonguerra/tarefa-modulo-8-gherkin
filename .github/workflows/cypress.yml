name: Cypress BDD Tests

on:
  push:
    branches: ["cypress-automation"]
  workflow_dispatch:

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm install
      - name: Run Cypress
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
