name: Cypress BDD Tests

on:
  push:
    branches: ["cypress-automation"]
  workflow_dispatch:

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone Practice Software Testing app
        run: git clone --depth 1 https://github.com/testsmith-io/practice-software-testing.git app-under-test

      - name: Start app via docker compose
        env:
          SPRINT: sprint5
        run: |
          cd app-under-test
          docker compose up -d
          echo "Waiting for laravel-api dependencies to install..."
          timeout 600 bash -c 'until docker compose exec -T laravel-api test -f vendor/autoload.php; do sleep 5; done'
          docker compose exec -T -u root laravel-api chown -R www-data:www-data storage bootstrap/cache
          docker compose exec -T laravel-api php artisan migrate:refresh --seed

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm install

      - name: Wait for backend API to be ready
        run: |
          echo "Waiting for API on port 8091..."
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8091/status | grep -q "200"; then
              echo "API is ready!"
              break
            fi
            echo "Attempt $i/60 - not ready yet, waiting 5s..."
            sleep 5
          done

      - name: Wait for Angular UI to be ready
        run: |
          echo "Waiting for Angular UI on port 4200..."
          for i in $(seq 1 60); do
            if curl -s http://localhost:4200 | grep -q "app-root"; then
              echo "Angular UI is ready!"
              break
            fi
            echo "Attempt $i/60 - not ready yet, waiting 5s..."
            sleep 5
          done
          echo "Giving the app a bit more time to warm up..."
          sleep 20

      - name: Run Cypress
        uses: cypress-io/github-action@v6
        with:
          browser: chrome

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-screenshots
          path: cypress/screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: cypress/videos